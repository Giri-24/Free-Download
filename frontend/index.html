<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Format Lab</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Media Format Lab</h1><p class="sub">A yt-dlp powered format inspector and downloader for content you are authorized to retrieve.</p><form id="form"><input id="url" type="url" required placeholder="Paste a supported video URL"><button>Analyze</button></form><div id="status"></div><section id="card" class="hidden"><img id="thumb"><div><h2 id="title"></h2><p id="meta"></p><label>Quality <select id="quality"><option value="best">Best available</option><option value="2160">2160p / 4K</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option><option value="240">240p</option><option value="audio">Audio only</option></select></label><button id="preview">Preview</button> <button id="download">Download</button></div></section><section id="player" class="hidden"><h3>Preview</h3><video id="video" controls playsinline style="width:100%;border-radius:12px"></video></section><section id="formats" class="hidden"><h3>Available formats</h3><div id="table"></div></section><p class="note">This application does not circumvent DRM, Premium-only access controls, private content, or other access restrictions.</p></main><script src="app.js"></script></body></html>
